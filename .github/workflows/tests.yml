name: Continuous integration

on: [ push, pull_request ]

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [
            ubuntu-latest,
            macos-latest,
            windows-latest,
        ]
        python-version: [ 3.11 ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Why these flags: see "Development setup" in docs/developer.rst.
      - name: Install dependencies with uv
        run: uv sync --frozen --all-groups

      - name: Show installed packages
        run: uv tree

      # The math-snippet guard validates docs snippets with the MathJax
      # engine (utils/check_math_snippets_node.cjs); Node is preinstalled
      # on all runner OSes.
      - name: Install MathJax with npm
        run: npm ci

      - name: Test FLPQ_Data
        run: uv run pytest
