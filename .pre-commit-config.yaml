repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.12.15
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must match the ruff version locked in uv.lock.
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-version-sync
        name: Check config.py and pyproject.toml versions match
        entry: python3 utils/check_version_sync.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ty-check
        name: ty type check
        entry: uv run ty check
        language: system
        pass_filenames: false
        files: \.py$
      - id: check-math-snippets
        name: Check math snippets with the MathJax engine
        entry: python3 utils/check_math_snippets.py
        language: system
        pass_filenames: false
        always_run: true
